name: Check RSS & Send Chapters

concurrency:
  group: rss-to-discord-state-rss
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [trigger-discord-notify]
  workflow_dispatch:
    inputs:
      feed:
        description: "Which chapter workflow should run?"
        type: choice
        required: true
        default: both
        options:
          - both
          - free
          - paid

permissions:
  contents: write

env:
  RSS_FEED_REPO: ${{ github.event.client_payload.rss_repo }}
  RSS_FEED_REF: ${{ github.event.client_payload.rss_ref }}

jobs:
  chapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/chapters.txt

      # Silent arc history sync only.
      # Does NOT post announcements, so it will not disrupt chapter order.
      - name: Sync Arc History
        if: >
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch'
        timeout-minutes: 10
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANNOUNCE_ARCS: "0"
          USE_UNARCHIVE: "0"
        run: python new_arc_checker.py

      # FREE feed → Novel threads
      - name: Run Free Chapters Bot
        if: >
          (github.event_name == 'workflow_dispatch' && (inputs.feed == 'free' || inputs.feed == 'both')) ||
          (github.event_name == 'repository_dispatch' && (github.event.client_payload.feed == 'free' || github.event.client_payload.feed == 'both'))
        timeout-minutes: 5
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # BOOTSTRAP_LATEST: '1'   # uncomment for first run to avoid backfill
          GIT_STATE_AUTO_COMMIT: "0"
        run: python bot_free_chapters.py

      # PAID feed → Novel threads
      - name: Run Paid Chapters Bot
        if: >
          (github.event_name == 'workflow_dispatch' && (inputs.feed == 'paid' || inputs.feed == 'both')) ||
          (github.event_name == 'repository_dispatch' && (github.event.client_payload.feed == 'paid' || github.event.client_payload.feed == 'both'))
        timeout-minutes: 15
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GIT_STATE_AUTO_COMMIT: "0"
        run: python bot_paid_chapters.py

      - name: Commit state
        if: ${{ always() }}
        shell: bash
        env:
          GIT_STATE_PUSH_RETRIES: "5"
          GIT_STATE_PUSH_RETRY_DELAY: "3"
        run: |
          .github/scripts/commit_paths_with_retry.sh "ci: update state_rss.json" state_rss.json
