name: Check RSS & Send Chapters

concurrency:
  group: rss-to-discord-state-rss
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [trigger-discord-notify]
  workflow_dispatch:
    inputs:
      feed:
        description: "Which chapter workflow should run?"
        type: choice
        required: true
        default: both
        options:
          - both
          - free
          - paid

permissions:
  contents: write

jobs:
  chapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/chapters.txt

      # Silent arc history sync only.
      # Does NOT post announcements, so it will not disrupt chapter order.
      - name: Sync Arc History
        if: >
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'repository_dispatch'
        timeout-minutes: 10
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANNOUNCE_ARCS: "0"
          USE_UNARCHIVE: "0"
        run: python new_arc_checker.py

      # FREE feed → Novel threads
      - name: Run Free Chapters Bot
        if: >
          (github.event_name == 'workflow_dispatch' && (inputs.feed == 'free' || inputs.feed == 'both')) ||
          (github.event_name == 'repository_dispatch' && (github.event.client_payload.feed == 'free' || github.event.client_payload.feed == 'both'))
        timeout-minutes: 5
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # BOOTSTRAP_LATEST: '1'   # uncomment for first run to avoid backfill
        run: python bot_free_chapters.py

      # PAID feed → Novel threads
      - name: Run Paid Chapters Bot
        if: >
          (github.event_name == 'workflow_dispatch' && (inputs.feed == 'paid' || inputs.feed == 'both')) ||
          (github.event_name == 'repository_dispatch' && (github.event.client_payload.feed == 'paid' || github.event.client_payload.feed == 'both'))
        timeout-minutes: 15
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python bot_paid_chapters.py

      - name: Commit state
        if: ${{ always() }}
        shell: bash
        run: |
          git pull --rebase --autostash
          git add state_rss.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update state_rss.json"
          git push