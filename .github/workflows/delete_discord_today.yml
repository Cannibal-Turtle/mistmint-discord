name: Delete Today's Discord Messages (MYT)

on:
  workflow_dispatch:
    inputs:
      channel_ids:
        description: "Channel/Thread IDs; separate multiple IDs with commas, spaces, or new lines. Leave blank to use TDLBKGC_THREAD_ID."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  delete_today:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete today's messages (MYT)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_IDS: ${{ inputs.channel_ids }}
          FALLBACK_CHANNEL_ID: ${{ secrets.TDLBKGC_THREAD_ID }}
        run: python tools/delete_discord_today.py
